services:
  dashcam-sync:
    build:
      context: .
    network_mode: host
    environment:
      DASHCAM_PORT: ${DASHCAM_PORT:-8081}
      DASHCAM_DOWNLOAD_ROOT: /volume1/Data/DashCam
      DASHCAM_REQUIRE_CAMERA_SETTINGS: "true"
      DASHCAM_CAMERA_1_IP: ${DASHCAM_CAMERA_1_IP:-192.168.1.58}
      DASHCAM_CAMERA_1_NAME: ${DASHCAM_CAMERA_1_NAME:-Impreza Dashcam}
      DASHCAM_CAMERA_2_IP: ${DASHCAM_CAMERA_2_IP:-192.168.1.57}
      DASHCAM_CAMERA_2_NAME: ${DASHCAM_CAMERA_2_NAME:-Forrester Dashcam}
    volumes:
      - "${DOWNLOADS_HOST_PATH:-/volume1/Data/DashCam}:/volume1/Data/DashCam"